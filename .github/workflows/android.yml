name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate local data and UI JavaScript
        run: |
          node --check app/src/main/assets/hardware-data.js
          node --check app/src/main/assets/catalog-extra-v061.js
          node --check app/src/main/assets/catalog-domestic-v061.js
          node --check app/src/main/assets/evidence-normalize-v061.js
          node --check app/src/main/assets/market-prices-v061.js
          node --check app/src/main/assets/market-domestic-v061.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/v061-hotfix.js
          node --check app/src/main/assets/v062-core.js
          node tools/validate-data.js
          node tools/validate-v061.js
          node tools/validate-ui-v062.js
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmartPCBuilder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
