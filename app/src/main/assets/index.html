ard.socket]);if(p.board&&p.ram&&p.board.ram!==p.ram.ram)ds.push(['bad','主板需要 '+p.board.ram+'，当前内存为 '+p.ram.ram]);if(p.cpu&&p.ram&&p.cpu.ram.indexOf(p.ram.ram)<0)ds.push(['bad','CPU平台与内存类型不匹配']);if(p.gpu&&p.case&&p.gpu.length&&p.case.length&&p.gpu.length>p.case.length)ds.push(['bad','显卡长度超过机箱限长']);let need=Math.ceil((w+120)/50)*50;if(p.psu&&p.psu.watts<need)ds.push(['bad','电源偏小，建议至少 '+need+'W']);if(t>S.budget)ds.push(['warn','当前配置超过预算 '+M(t-S.budget)]);if(!ds.length&&O.filter(c=>p[c]).length>=4)ds.push(['good','当前未发现明显硬冲突']);total.textContent=M(t);left.textContent=(S.budget-t>=0?'':'-')+M(Math.abs(S.budget-t));power.textContent=Math.round(w)+'W';diag.innerHTML=ds.length?ds.map(d=>'<div class="status '+d[0]+'">'+d[1]+'</div>').join(''):'<div class="status warn">继续选择配件后开始诊断。</div>';shops.innerHTML=O.filter(c=>p[c]).map(c=>'<div class="item"><b>'+L[c]+' · '+p[c].name+'</b><small>2026-09-19 参考均价 '+M(p[c].price)+' · <span class="chip '+p[c].heat+'">'+p[c].heatName+'</span></small><div class="shop"><button onclick="openP(\'jd\',\''+p[c].name+'\')">京东</button><button onclick="openP(\'tb\',\''+p[c].name+'\')">淘宝</button><button onclick="openP(\'pdd\',\''+p[c].name+'\')">拼多多</button></div></div>').join('')}function autoFill(){let b=S.budget,p={};if(b<800)p={};else if(b<1700)p={cpu:'r5500',board:'a520',ram:'d4-16',ssd:'500',psu:'500',cooler:'basic',case:'budget'};else if(b<3000)p={cpu:'r5600',board:'b550',gpu:'rx580',ram:'d4-16',ssd:'500',psu:'500',cooler:'basic',case:'budget'};else if(b<5000)p={cpu:'7500f',board:'b650',gpu:'3050',ram:'d5-16',ssd:'1t',psu:'650',cooler:'s1',case:'mid'};else if(b<7000)p={cpu:'7500f',board:'b650',gpu:'5060',ram:'d5-32',ssd:'1t',psu:'650',cooler:'s1',case:'mid'};else if(b<10000)p={cpu:'9600x',board:'b850',gpu:'5060ti16',ram:'d5-32',ssd:'1t',psu:'750',cooler:'s1',case:'mid'};else if(b<14000)p={cpu:'9700x',board:'b850',gpu:'5070',ram:'d5-32',ssd:'2t',psu:'850',cooler:'s2',case:'tower'};else if(b<20000)p={cpu:'9800x3d',board:'b850',gpu:'5070ti',ram:'
